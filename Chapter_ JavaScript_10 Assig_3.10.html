<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Chapter 3.10        
    </title>
</head>
<body>

    <button onclick="showMessage()">Click Me</button>

<script>

//  Here Start Event Handler Example
function showMessage() {
  alert("Button Clicked!");
}

// Chaining Promise Example
function step1() {
  return new Promise(resolve => {
    setTimeout(() => resolve("Step 1 complete"), 1000);
  });
}

function step2(message) {
  return new Promise(resolve => {
    setTimeout(() => resolve(message + " → Step 2 complete"), 1000);
  });
}

// Async/Await Example
async function runSteps() {
  try {
    let result1 = await step1();
    console.log(result1);

    let result2 = await step2(result1);
    console.log(result2);

  } catch (error) {
    console.log(error);
  }
}

runSteps();

</script>
    
</body>
</html>
